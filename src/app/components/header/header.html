<header class="header" [class.scrolled]="scrolled()">
  <div class="container bar">
    <a routerLink="/" class="logo" (mouseenter)="wiggleLogo()">
      <span class="logo-icon">{{ settings().logoEmoji }}</span>
      <span>{{ settings().shopName }}</span>
    </a>

    <nav class="nav-desktop" aria-label="Menu chính">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >{{ item.label }}</a>
      }
    </nav>

    <div class="tools">
    <button
      class="theme-btn"
      type="button"
      (click)="toggleTheme($event)"
      [attr.aria-label]="isDark() ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'"
      [title]="isDark() ? 'Giao diện sáng' : 'Giao diện tối'"
    >
      <span class="theme-icon">
        @if (isDark()) {
          <!-- Mặt trời -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <!-- Biểu tượng terminal: >_ -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4" width="19" height="16" rx="3" />
            <path d="M7 10l3 2.5L7 15M12.5 15H17" />
          </svg>
        }
      </span>
    </button>

    <button
      class="burger"
      type="button"
      [class.open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Mở menu"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="nav-mobile" aria-label="Menu di động">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >{{ item.label }}</a>
      }
    </nav>
  }
</header>
